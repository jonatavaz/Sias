<!DOCTYPE html>
<html th:fragment="layoutBase(titulo, conteudo)" xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
    <title th:replace="${titulo}">SIAS Base</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .btn-fab {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: transform 0.3s;
        }
        .btn-fab[aria-expanded="true"] i {
            transform: rotate(45deg);
            transition: transform 0.3s;
        }
        .btn-fab[aria-expanded="false"] i {
            transform: rotate(0deg);
            transition: transform 0.3s;
        }
    </style>
</head>
<body class="bg-dark">

<div class="dropup position-fixed bottom-0 end-0 mb-4 me-4" style="z-index: 1050;">
    <ul class="dropdown-menu dropdown-menu-end shadow-lg mb-2 rounded-3 border-0">
        <li>
            <a class="dropdown-item py-2 d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-calendar-plus text-primary fs-5"></i> Nova Visita
            </a>
        </li>
        <li>
            <a class="dropdown-item py-2 d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-user-plus text-success fs-5"></i> Nova Pessoa
            </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
            <a class="dropdown-item py-2 d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-file-excel text-danger fs-5"></i> Gerar Relatório
            </a>
        </li>
    </ul>

    <button class="btn btn-primary rounded-circle shadow-lg btn-fab" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="fa-solid fa-plus"></i>
    </button>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
