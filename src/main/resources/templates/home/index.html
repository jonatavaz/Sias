<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/layout :: layoutBase('Início - SIAS', ~{::main}, null, null)}">
<body>
<main class="container-fluid pt-4 mt-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 text-gray-800">Painel Geral</h2>
    </div>

    <div class="row mb-4">

        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-0 border-start border-primary border-4 shadow rounded-4 h-100 theme-card">
                <div class="card-body p-4">
                    <div class="row align-items-center g-0">
                        <div class="col me-2">
                            <div class="small fw-bold text-primary text-uppercase mb-2" style="letter-spacing: 0.05rem;">
                                Famílias Assistidas
                            </div>
                            <div class="fs-3 fw-bold mb-0" th:text="${totalFamilias ?: 0}">0</div>
                        </div>
                        <div class="col-auto">
                            <div class="d-flex align-items-center justify-content-center bg-primary bg-opacity-10 rounded-circle" style="width: 60px; height: 60px;">
                                <i class="fa-solid fa-people-roof fa-2x text-primary"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-0 border-start border-warning border-4 shadow rounded-4 h-100 theme-card">
                <div class="card-body p-4">
                    <div class="row align-items-center g-0">
                        <div class="col me-2">
                            <div class="small fw-bold text-warning text-uppercase mb-2" style="letter-spacing: 0.05rem;">
                                Necessidades Pendentes
                            </div>
                            <div class="fs-3 fw-bold mb-0" th:text="${necessidadesPendentes ?: 0}">0</div>
                        </div>
                        <div class="col-auto">
                            <div class="d-flex align-items-center justify-content-center bg-warning bg-opacity-10 rounded-circle" style="width: 60px; height: 60px;">
                                <i class="fa-solid fa-hand-holding-heart fa-2x text-warning"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-0 border-start border-danger border-4 shadow rounded-4 h-100 theme-card">
                <div class="card-body p-4">
                    <div class="row align-items-center g-0">
                        <div class="col me-2">
                            <div class="small fw-bold text-danger text-uppercase mb-2" style="letter-spacing: 0.05rem;">
                                Visitas Pendentes
                            </div>
                            <div class="fs-3 fw-bold mb-0" th:text="${visitasPendentes ?: 0}">0</div>
                        </div>
                        <div class="col-auto">
                            <div class="d-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle" style="width: 60px; height: 60px;">
                                <i class="fa-solid fa-calendar-day fa-2x text-danger"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-3 col-md-6 mb-4">
            <div class="card border-0 border-start border-success border-4 shadow rounded-4 h-100 theme-card">
                <div class="card-body p-4">
                    <div class="row align-items-center g-0">
                        <div class="col me-2">
                            <div class="small fw-bold text-success text-uppercase mb-2" style="letter-spacing: 0.05rem;">
                                Visitas Realizadas
                            </div>
                            <div class="fs-3 fw-bold mb-0" th:text="${visitasRealizadas ?: 0}">0</div>
                        </div>
                        <div class="col-auto">
                            <div class="d-flex align-items-center justify-content-center bg-success bg-opacity-10 rounded-circle" style="width: 60px; height: 60px;">
                                <i class="fa-solid fa-check-double fa-2x text-success"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="row mt-4 mb-5">
        <div class="col-lg-6 mb-4">
            <div class="card shadow border-0 rounded-4 h-100 theme-card">
                <div class="card-header bg-transparent border-bottom-0 pt-4 pb-0 px-4">
                    <h6 class="m-0 font-weight-bold text-uppercase text-muted" style="letter-spacing: 0.05rem;">
                        <i class="fa-solid fa-chart-pie me-2 text-warning"></i>Status das Necessidades
                    </h6>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center p-4">
                    <div style="width: 100%; max-width: 320px; position: relative;">
                        <canvas id="graficoNecessidades"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-6 mb-4">
            <div class="card shadow border-0 rounded-4 h-100 theme-card">
                <div class="card-header bg-transparent border-bottom-0 pt-4 pb-0 px-4">
                    <h6 class="m-0 font-weight-bold text-uppercase text-muted" style="letter-spacing: 0.05rem;">
                        <i class="fa-solid fa-chart-doughnut me-2 text-danger"></i>Status dos Agendamentos
                    </h6>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center p-4">
                    <div style="width: 100%; max-width: 320px; position: relative;">
                        <canvas id="graficoVisitas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            const necPendentes = /*[[${necessidadesPendentes != null ? necessidadesPendentes : 0}]]*/ 0;
            const necAtendidas = /*[[${necessidadesAtendidas != null ? necessidadesAtendidas : 0}]]*/ 0;

            const visPendentes = /*[[${visitasPendentes != null ? visitasPendentes : 0}]]*/ 0;
            const visRealizadas = /*[[${visitasRealizadas != null ? visitasRealizadas : 0}]]*/ 0;

            const canvasNec = document.getElementById('graficoNecessidades');
            if (canvasNec) {
                new Chart(canvasNec.getContext('2d'), {
                    type: 'pie',
                    data: {
                        labels: ['Pendentes', 'Atendidas'],
                        datasets: [{
                            data: [necPendentes, necAtendidas],
                            backgroundColor: ['#ffc107', '#198754'],
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }

            const canvasVis = document.getElementById('graficoVisitas');
            if (canvasVis) {
                new Chart(canvasVis.getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Agendadas (Pendentes)', 'Realizadas'],
                        datasets: [{
                            data: [visPendentes, visRealizadas],
                            backgroundColor: ['#dc3545', '#198754'],
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
            }
        });
    </script>
</main>
</body>
</html>
