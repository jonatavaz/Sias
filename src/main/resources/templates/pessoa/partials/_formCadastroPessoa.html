<form th:fragment="formFragment" id="formPessoa">

    <input type="hidden" id="codPessoa" name="codPessoa" th:value="${pessoa?.codPessoa}">

    <div class="mb-3">
        <label for="nome" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="nome" name="nome" th:value="${pessoa?.nome}" required>
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="cpf" th:value="${pessoa?.cpf}" required>
        </div>

        <div class="col-md-6 ">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="telefone" name="telefone" th:value="${pessoa?.telefone}">
        </div>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" th:value="${pessoa?.email}">
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="dataNascimento" class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control" id="dataNascimento" name="dataNascimento"
                   th:value="${pessoa?.dataNascimento != null ? #dates.format(pessoa.dataNascimento, 'yyyy-MM-dd') : ''}" required>
        </div>

        <div class="col-md-6 pt-md-4">
            <div class="form-check form-switch pt-1">
                <input class="form-check-input" type="checkbox" id="pessoaVoluntario" name="pessoaVoluntario">
                <label class="form-check-label" for="pessoaVoluntario"> Essa pessoa será um voluntário? </label>
            </div>
        </div>
        <div class="my-3"></div>
    </div>


    <div id="cadastroVoluntario" class="d-none">
        <hr>
        <h6 >Cadastro de Voluntário</h6>
        <hr>
        <div class="mb-3">
            <label for="profissaoHabilidade" class="form-label">Profissão/Habilidade</label>
            <input type="text" class="form-control" id="profissaoHabilidade" name="profissaoHabilidade">
        </div>
        <div class="mb-3">
            <div class="form-check form-switch pt-1">
                <input class="form-check-input" type="checkbox" id="ativoVoluntario" name="ativoVoluntario">
                <label class="form-check-label" for="ativoVoluntario"> Esse voluntário está ativo? </label>
            </div>
        </div>
    </div>

    <div class="d-grid mt-4">
        <button type="button" onclick="CadastroPessoa()" class="btn btn-secondary">
            <i class="fa-solid fa-floppy-disk me-2"></i>Salvar Cadastro
        </button>
    </div>
</form>

<script>
    document.getElementById('pessoaVoluntario').addEventListener('change', function() {
        const divCadastro = document.getElementById('cadastroVoluntario');

        if (this.checked) {
            divCadastro.classList.remove('d-none');
        } else {
            divCadastro.classList.add('d-none');
            document.getElementById('profissaoHabilidade').value = '';
            document.getElementById('ativoVoluntario').checked = false;
        }
    });
</script>
