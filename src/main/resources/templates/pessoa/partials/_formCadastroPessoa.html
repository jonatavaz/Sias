<form hx-post="/pessoas" hx-target="#offcanvas-body-content" hx-swap="innerHTML">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="cpf" required>
        </div>

        <div class="col-md-6 ">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="telefone" name="telefone">
        </div>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email">
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="dataNascimento" class="form-label">Data de Nascimento</label>
            <input type="text" class="form-control" id="dataNascimento" name="dataNascimento" required>
        </div>

        <div class="col-md-6 ">
            <label for="cep" class="form-label">CEP</label>
            <input type="text" class="form-control" id="cep" name="cep">
        </div>
    </div>
    <div class="mb-3">
        <label for="endereco" class="form-label">Endereço</label>
        <input type="endereco" class="form-control" id="endereco" name="endereco" disabled>
    </div>
    <div class="mb-3">
        <label for="numero" class="form-label">Número</label>
        <input type="numero" class="form-control" id="numero" name="numero" disabled>
    </div>
    <div class="mb-3">
        <label for="complemento" class="form-label">Complemento</label>
        <input type="complemento" class="form-control" id="complemento" name="complemento" disabled>
    </div>
    <div class="mb-3">
        <label for="bairro" class="form-label">Bairro</label>
        <input type="bairro" class="form-control" id="bairro" name="bairro" disabled>
    </div>

    <div class="mb-3">
        <label for="cidade" class="form-label">Cidade</label>
        <input type="cidade" class="form-control" id="cidade" name="cidade" disabled>
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="uf" class="form-label">UF</label>
            <input type="uf" class="form-control" id="uf" name="uf" disabled>
        </div>

        <div class="col-md-6 pt-md-4">
            <div class="form-check form-switch pt-1">
                <input class="form-check-input" type="checkbox" id="pessoaVoluntario" name="pessoaVoluntario">
                <label class="form-check-label" for="pessoaVoluntario"> Essa pessoa será um voluntário? </label>
            </div>
        </div>
        <div class="my-3"></div>
    </div>

    <div id="cadastroVoluntario" class="d-none">
        <hr>
        <h6 >Cadastro de Voluntário</h6>
        <hr>
        <div class="mb-3">
            <label for="profissaoHabilidade" class="form-label">Profissao/Habilidade</label>
            <input type="text" class="form-control" id="profissaoHabilidade" name="profissaoHabilidade">
        </div>
        <div class="mb-3">
            <div class="form-check form-switch pt-1">
                <input class="form-check-input" type="checkbox" id="ativoVoluntario" name="ativoVoluntario">
                <label class="form-check-label" for="ativoVoluntario"> Esse voluntário está ativo? </label>
            </div>
        </div>
    </div>

    <div class="d-grid mt-4">
        <button type="button" class="btn btn-secondary" onclick="CadastroPessoa()">
            <i class="fa-solid fa-floppy-disk me-2"></i>Salvar Cadastro
        </button>
    </div>
</form>

<script>
    document.getElementById('pessoaVoluntario').addEventListener('change', function() {
        const divCadastro = document.getElementById('cadastroVoluntario');

        if (this.checked) {
            divCadastro.classList.remove('d-none');
        } else {
            divCadastro.classList.add('d-none');
            document.getElementById('profissaoHabilidade').value = '';
            document.getElementById('ativoVoluntario').checked = false;
        }
    });
</script>
