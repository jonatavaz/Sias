<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .left-side {
            width: 60%;
            background: linear-gradient(-45deg, #0d6efd, #004e92, #000428, #0a58ca);
            background-size: 400% 400%;
            animation: moverFundo 12s ease infinite;
        }

        .right-side {
            width: 40%;
            background-color: #ffffff;
        }

        @keyframes moverFundo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 992px) {
            .left-side, .right-side {
                width: 100%;
            }
            .left-side {
                height: 35vh;
            }
            .right-side {
                height: 65vh;
            }
        }
    </style>
</head>
<body class="d-flex flex-column flex-lg-row vh-100 m-0">

<div class="left-side d-flex flex-column justify-content-center align-items-center text-white p-5 shadow-lg z-1">
    <h1 class="display-3 fw-bold mb-3">SIAS</h1>
    <p class="fs-4 fw-light text-center">Sistema Integrado de Assistência Social</p>
</div>

<div class="right-side d-flex justify-content-center align-items-center p-5">

    <div class="w-100" style="max-width: 420px;">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Bem-vindo</h2>
            <p class="text-muted">Acesse a plataforma para continuar</p>
        </div>

        <div th:if="${erro != null}" class="alert alert-danger text-center shadow-sm" th:text="${erro}"></div>

        <form th:action="@{/logar}" method="POST">
            <div class="mb-4 text-start">
                <label for="cpf" class="form-label fw-medium text-secondary">CPF</label>
                <input type="text" class="form-control form-control-lg bg-light border-0 shadow-sm"
                       id="cpf" name="cpf" required placeholder="Apenas números">
            </div>

            <div class="mb-5 text-start">
                <label for="senha" class="form-label fw-medium text-secondary">Senha</label>
                <input type="password" class="form-control form-control-lg bg-light border-0 shadow-sm"
                       id="senha" name="senha" required placeholder="Digite sua senha">
            </div>

            <div class="d-grid mt-2">
                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">Entrar no Sistema</button>
            </div>
        </form>

    </div>
</div>

</body>
</html>
