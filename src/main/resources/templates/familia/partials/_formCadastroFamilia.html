<form id="formFamilia" th:fragment="formFragment" hx-target="#offcanvas-body-content" hx-swap="innerHTML">

    <input type="hidden" id="codFamilia" name="codFamilia" th:value="${payload?.codFamilia ?: 0}">
    <input type="hidden" id="codEndereco" name="codEndereco" th:value="${payload?.codEndereco ?: 0}">
    <input type="hidden" id="codPessoaResponsavel" name="codPessoaResponsavel" th:value="${payload?.codPessoaResponsavel ?: 0}">
    <input type="hidden" id="codPessoa" name="pessoa.codPessoa" th:value="${payload?.pessoa?.codPessoa ?: 0}">

    <div class="mb-3">
        <label for="cpfResponsavel" class="form-label">CPF do Responsável Familiar <span style="color: #b02a37"> O responsável deve ter sido cadastrado na área de pessoas.</span></label>
        <input type="text" class="form-control" id="cpfResponsavel" name="cpfResponsavel" th:value="${payload?.cpfResponsavel}" required>
    </div>

    <hr>
    <h6>Cadastro de Membros Familiares</h6>
    <hr>

    <div class="mb-3">
        <label for="nome" class="form-label">Nome Completo</label>
        <input type="text" class="form-control" id="nome" name="pessoa.nome" th:value="${payload?.pessoa?.nome}" required>
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="pessoa.cpf" th:value="${payload?.pessoa?.cpf}" required>
        </div>

        <div class="col-md-6 ">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="telefone" name="pessoa.telefone" th:value="${payload?.pessoa?.telefone}">
        </div>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="pessoa.email" th:value="${payload?.pessoa?.email}">
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="dataNascimento" class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control" id="dataNascimento" name="pessoa.dataNascimento"
                   th:value="${payload?.pessoa?.dataNascimento != null ? #dates.format(payload.pessoa.dataNascimento, 'yyyy-MM-dd') : ''}" required>
        </div>

        <div class="col-md-6 ">
            <label for="cep" class="form-label">CEP</label>
            <input type="text" class="form-control" id="cep" name="endereco.cep" th:value="${payload?.endereco?.cep}" onblur="BuscarCEP(this.value)">
        </div>
    </div>

    <div class="mb-3">
        <label for="logradouro" class="form-label">Endereço (Logradouro)</label>
        <input type="text" class="form-control" id="logradouro" name="endereco.logradouro" th:value="${payload?.endereco?.logradouro}" readonly>
    </div>

    <div class="mb-3">
        <label for="numero" class="form-label">Número</label>
        <input type="text" class="form-control" id="numero" name="endereco.numero" th:value="${payload?.endereco?.numero}">
    </div>

    <div class="mb-3">
        <label for="complemento" class="form-label">Complemento</label>
        <input type="text" class="form-control" id="complemento" name="endereco.complemento" th:value="${payload?.endereco?.complemento}">
    </div>

    <div class="mb-3">
        <label for="bairro" class="form-label">Bairro</label>
        <input type="text" class="form-control" id="bairro" name="endereco.bairro" th:value="${payload?.endereco?.bairro}" readonly>
    </div>

    <div class="mb-3">
        <label for="cidade" class="form-label">Cidade</label>
        <input type="text" class="form-control" id="cidade" name="endereco.cidade" th:value="${payload?.endereco?.cidade}" readonly>
    </div>

    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <label for="uf" class="form-label">UF</label>
            <input type="text" class="form-control" id="uf" name="endereco.uf" th:value="${payload?.endereco?.uf}" readonly>
        </div>

        <div class="col-md-6 ">
            <label for="grauParentesco" class="form-label">Grau de Parentesco</label>
            <select class="form-select" id="grauParentesco" name="grauParentesco" required>
                <option value="" th:selected="${payload == null}">Selecione</option>
                <option value="Filho" th:selected="${payload?.grauParentesco == 'Filho'}">Filho</option>
                <option value="Esposa" th:selected="${payload?.grauParentesco == 'Esposa'}">Esposa</option>
                <option value="Filha" th:selected="${payload?.grauParentesco == 'Filha'}">Filha</option>
                <option value="Primo" th:selected="${payload?.grauParentesco == 'Primo'}">Primo</option>
                <option value="Sobrinho" th:selected="${payload?.grauParentesco == 'Sobrinho'}">Sobrinho</option>
                <option value="Avó" th:selected="${payload?.grauParentesco == 'Avó'}">Avó</option>
                <option value="Avô" th:selected="${payload?.grauParentesco == 'Avô'}">Avô</option>
            </select>
        </div>
    </div>

    <div class="d-grid mt-4">
        <button type="button" onclick="SalvarFamilia()" class="btn btn-secondary">
            <i class="fa-solid fa-floppy-disk me-2"></i>Salvar Cadastro
        </button>
    </div>
</form>
